services:
  - type: web
    name: liebchen-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn liebchen.api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: "llama3.2"
      - key: PORT
        value: 10000
